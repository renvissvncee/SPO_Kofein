[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kofein-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.21,<4",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".."]
testpaths = ["tests"]

[tool.pyright]
include = ["."]

[tool.setuptools]
packages = ["backend", "backend.db"]

[tool.setuptools.package-dir]
backend = "."
"backend.db" = "db"

[tool.setuptools.package-data]
backend = ["static/*"]
