name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Бэкенд — линтер (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install "ruff>=0.8,<1"
      - name: Проверка кода
        run: ruff check --output-format=github .
      - name: Проверка форматирования
        run: ruff format --check .

  backend-tests:
    name: Бэкенд — тесты (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kofein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kofein_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Тесты
        run: python -m pytest -rs --junitxml=pytest-report.xml
      - name: Проверка, что интеграционные тесты не пропущены
        run: |
          if grep -q '<skipped' pytest-report.xml; then
            echo "::error::Часть тестов пропущена: PostgreSQL в CI недоступен"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  frontend-lint:
    name: Фронтенд — линтер (ESLint)
    runs-on: ubuntu-latest
    # Пока не блокирует сборку: в frontend/ 29 ошибок ESLint, их исправляет
    # автор фронтенда. После исправления строку continue-on-error нужно удалить.
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps: @pbe/react-yandex-maps ещё не объявляет поддержку React 19
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
